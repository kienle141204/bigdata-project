# Apache Airflow Docker Compose Configuration
# Sử dụng image kienle1412/bigdata:latest đã có sẵn
#
# Ports:
#   - 8081: Airflow Web UI
#
# Sử dụng:
#   docker compose -f docker-compose.airflow.yml up -d

version: '3.8'

x-airflow-common: &airflow-common
  image: kienle1412/bigdata:latest
  environment:
    # Airflow Core
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'Asia/Ho_Chi_Minh'
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: 'Asia/Ho_Chi_Minh'

    # AWS S3 Configuration (from .env)
    AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_REGION: ${AWS_REGION:-ap-southeast-1}
    AWS_S3_PREFIX: ${AWS_S3_PREFIX:-premier_league}

    # Selenium
    HEADLESS: 'true'
    REQUEST_DELAY: '2'

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  # Chạy với root để tránh permission issues
  # user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
  networks:
    - airflow-network

services:
  # PostgreSQL Database for Airflow
  postgres:
    image: postgres:14
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - airflow-network

  # Airflow Webserver (UI)
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: bash -c "pip install apache-airflow[postgres] psycopg2-binary && airflow webserver"
    ports:
      - "8081:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: bash -c "pip install apache-airflow[postgres] psycopg2-binary && airflow scheduler"
    shm_size: "2gb"
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Airflow Init (database initialization)
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install apache-airflow[postgres] psycopg2-binary

        # Initialize database
        airflow db init

        # Create admin user
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@localhost \
          --password admin || true

        echo "✅ Airflow initialized successfully!"
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  airflow-network:
    driver: bridge

volumes:
  postgres-db-volume:
